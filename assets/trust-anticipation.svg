<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-labelledby="title desc">
  <title id="title">One example of trust and anticipation</title>
  <desc id="desc">A fictional hotel cancellation deadline moves up. The assistant flags it in time but leaves the booking alone without the user's go-ahead.</desc>
  <rect x="1" y="1" width="638" height="306" rx="18" fill="#0c1323" stroke="#304b7d" stroke-width="2"/>
  <g font-family="system-ui, Segoe UI, Arial, sans-serif">
    <text x="27" y="35" fill="#8cbaff" font-size="16" font-weight="700" letter-spacing="2.7">DESIGN EXAMPLE</text>
    <text x="26" y="78" fill="#f4f7ff" font-size="31" font-weight="700">Your hotel’s cancellation</text>
    <text x="26" y="114" fill="#f4f7ff" font-size="31" font-weight="700">deadline moves up.</text>
    <rect x="24" y="140" width="592" height="67" rx="10" fill="#162846"/>
    <circle cx="51" cy="174" r="9" fill="none" stroke="#9bc5ff" stroke-width="2"/>
    <path d="M51 168v6l4 3" fill="none" stroke="#9bc5ff" stroke-width="2" stroke-linecap="round"/>
    <text x="76" y="165" fill="#a6caff" font-size="15" font-weight="700" letter-spacing="1.8">ANTICIPATION</text>
    <text x="76" y="192" fill="#f4f7ff" font-size="25">Flag it while there’s time.</text>
    <rect x="24" y="217" width="592" height="67" rx="10" fill="#141e34" stroke="#324c7d"/>
    <path d="M45 249v-4a6 6 0 0 1 12 0v4m-14 0h16v12H43z" fill="none" stroke="#9bc5ff" stroke-width="2" stroke-linejoin="round"/>
    <text x="76" y="242" fill="#a6caff" font-size="15" font-weight="700" letter-spacing="1.8">TRUST</text>
    <text x="76" y="269" fill="#f4f7ff" font-size="25">Don’t cancel without my go-ahead.</text>
  </g>
</svg>
